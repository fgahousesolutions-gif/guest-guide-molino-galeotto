  <style>
    :root {
      --bg: #eef0f4;
      --card: #f7f7f8;
      --text: #18213c;
      --muted: #6b7890;
      --border: #273454;
      --primary: #0f1b3d;
      --primary-hover: #162754;
      --shadow: 0 8px 24px rgba(15, 27, 61, 0.08);
      --radius-xl: 26px;
      --radius-lg: 20px;
      --radius-md: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 22px;
    }

    .hero {
      background: var(--card);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow);
      margin-bottom: 22px;
    }

    .hero img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
    }

    .hero-content {
      padding: 28px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(34px, 5vw, 56px);
      line-height: 1.08;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
    }

    .space-top {
      margin-top: 18px;
    }

    .button-grid {
      display: grid;
      gap: 14px;
    }

    .lang-grid {
      grid-template-columns: repeat(5, minmax(0, 1fr));
      margin-top: 26px;
    }

    .lang-btn,
    .action-btn,
    .doc-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 62px;
      padding: 14px 16px;
      border-radius: 22px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: 0.2s ease;
      cursor: pointer;
      width: 100%;
      white-space: nowrap;
    }

    .lang-btn {
      background: transparent;
      color: var(--text);
      border: 2px solid var(--border);
    }

    .lang-btn:hover,
    .lang-btn.active {
      background: #e9edf5;
    }

    .primary-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-top: 22px;
    }

    .action-btn {
      background: var(--primary);
      color: #fff;
      border: 2px solid var(--border);
    }

    .action-btn:hover {
      background: var(--primary-hover);
    }

    .docs-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-top: 14px;
    }

    .doc-btn {
      background: transparent;
      color: var(--text);
      border: 2px solid var(--border);
    }

    .doc-btn:hover {
      background: #eef2f8;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      padding: 28px;
      margin-bottom: 22px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 34px;
    }

    .info-stack {
      display: grid;
      gap: 24px;
    }

    .info-item .label {
      display: block;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .info-item .value {
      font-size: 17px;
      color: var(--text);
      margin-bottom: 2px;
    }

    .info-item .note {
      font-size: 14px;
      color: var(--muted);
    }

    .wifi-network + .wifi-network {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(39, 52, 84, 0.12);
    }

    .wifi-network-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 28px;
      letter-spacing: -0.02em;
    }

    ul {
      margin: 0;
      padding-left: 22px;
    }

    li + li {
      margin-top: 8px;
    }

    .muted {
      color: var(--muted);
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      padding: 8px 0 24px;
    }

    @media (max-width: 1000px) {
      .lang-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 900px) {
      .docs-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .info-grid {
        grid-template-columns: 1fr;
        gap: 24px;
      }
    }

    @media (max-width: 700px) {
      .wrap {
        padding: 14px;
      }

      .hero img {
        height: 220px;
      }

      .hero-content,
      .card {
        padding: 20px;
      }

      .lang-grid,
      .primary-grid,
      .docs-grid {
        grid-template-columns: 1fr;
      }

      .lang-btn,
      .action-btn,
      .doc-btn {
        white-space: normal;
      }

      h2 {
        font-size: 24px;
      }
    }
  </style>
</head>

    function renderList(id, items) {
      document.getElementById(id).innerHTML = items.map(item => `<li>${item}</li>`).join("");
    }

    function renderWifi(lang) {
      const t = translations[lang] || translations.it;
      const wifiContent = document.getElementById("wifi-content");

      wifiContent.innerHTML = wifiNetworks.map(network => `
        <div class="wifi-network">
          <div class="wifi-network-title">${t[network.typeKey]}</div>
          <div class="value">${network.name}</div>
          <div class="note">${t.wifiPasswordLabel}: ${network.password}</div>
        </div>
      `).join("");
    }

    function getDocLang(lang) {
      if (lang === "it" || lang === "en" || lang === "de") return lang;
      return "en";
    }

    function setLanguage(lang) {
      const t = translations[lang] || translations.it;
      const docLang = getDocLang(lang);

      document.documentElement.lang = lang;

      document.getElementById("subtitle-1").textContent = t.subtitle1;
      document.getElementById("subtitle-2").textContent = t.subtitle2;

      document.getElementById("map-btn").textContent = t.mapBtn;
      document.getElementById("whatsapp-btn").textContent = t.whatsappBtn;

      document.getElementById("rules-btn").textContent = t.rulesBtn;
      document.getElementById("arrival-btn").textContent = t.arrivalBtn;
      document.getElementById("pet-btn").textContent = t.petBtn;
      document.getElementById("umbrella-btn").textContent = t.umbrellaBtn;

      document.getElementById("rules-btn").href = `house-rules-${docLang}.pdf`;
      document.getElementById("arrival-btn").href = `arrival-info-${docLang}.pdf`;

      document.getElementById("label-address").textContent = t.labelAddress;
      document.getElementById("label-checkin").textContent = t.labelCheckin;
      document.getElementById("label-checkout").textContent = t.labelCheckout;
      document.getElementById("label-wifi").textContent = t.labelWifi;
      document.getElementById("label-contact").textContent = t.labelContact;
      document.getElementById("contact-note").textContent = t.contactNote;
      document.getElementById("label-parking").textContent = t.labelParking;
      document.getElementById("parking-short").textContent = t.parkingShort;

      renderWifi(lang);

      document.getElementById("access-title").textContent = t.accessTitle;
      document.getElementById("access-text").textContent = t.accessText;
      document.getElementById("access-note").textContent = t.accessNote;

      document.getElementById("rules-title").textContent = t.rulesTitle;
      renderList("rules-list", t.rulesList);

      document.getElementById("waste-title").textContent = t.wasteTitle;
      document.getElementById("waste-text").textContent = t.wasteText;
      document.getElementById("waste-note").textContent = t.wasteNote;

      document.getElementById("checkout-title").textContent = t.checkoutTitle;
      renderList("checkout-list", t.checkoutList);

      document.getElementById("suggestions-title").textContent = t.suggestionsTitle;
      document.getElementById("restaurants-title").textContent = t.restaurantsTitle;
      renderList("restaurants-list", t.restaurantsList);

      document.getElementById("attractions-title").textContent = t.attractionsTitle;
      renderList("attractions-list", t.attractionsList);

      document.getElementById("map-title").textContent = t.mapTitle;
      document.getElementById("map-text").textContent = t.mapText;
      document.getElementById("coords-label").textContent = t.coordsLabel;

      document.getElementById("footer-text").textContent = t.footerText;

      document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });

      localStorage.setItem("guestGuideLang", lang);
    }

    document.querySelectorAll(".lang-btn").forEach(btn => {
      btn.addEventListener("click", () => setLanguage(btn.dataset.lang));
    });

    setLanguage(localStorage.getItem("guestGuideLang") || "it");
