  <style>
    :root {
      --bg: #f7f4ef;
      --card: #ffffff;
      --text: #2d2a26;
      --muted: #6f685f;
      --accent: #6f7d4e;
      --accent-dark: #56613d;
      --line: #e7dfd4;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 18px;
    }

    .hero {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .hero img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
    }

    .hero-content {
      padding: 24px;
    }

    h1 {
      font-size: clamp(30px, 5vw, 44px);
      line-height: 1.1;
      margin: 0 0 8px;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
    }

    .box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 18px;
    }

    .languages {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 4px;
    }

    .lang-btn {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      background: #f2eee7;
      color: var(--text);
      border: 1px solid transparent;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .lang-btn:hover {
      border-color: var(--line);
    }

    .lang-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 6px;
    }

    .quick-links a {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }

    .quick-links a.secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .info-card {
      background: #fcfbf8;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
    }

    .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 5px;
      font-weight: 700;
    }

    .value {
      font-size: 16px;
      font-weight: 600;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 24px;
      letter-spacing: -0.02em;
    }

    h3 {
      margin: 18px 0 8px;
      font-size: 18px;
    }

    ul {
      margin: 0;
      padding-left: 20px;
    }

    li + li {
      margin-top: 8px;
    }

    a {
      color: var(--accent-dark);
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }

    .muted {
      color: var(--muted);
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      padding: 8px 0 30px;
    }

    @media (max-width: 700px) {
      .hero img {
        height: 220px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .hero-content,
      .box {
        padding: 18px;
      }

      h2 {
        font-size: 22px;
      }
    }
  </style>
</head>

    function renderList(elementId, items) {
      document.getElementById(elementId).innerHTML = items.map(item => `<li>${item}</li>`).join("");
    }

    function setLanguage(lang) {
      const t = translations[lang] || translations.it;

      document.documentElement.lang = lang;

      document.getElementById("subtitle-1").textContent = t.subtitle1;
      document.getElementById("subtitle-2").textContent = t.subtitle2;

      document.getElementById("map-link").textContent = t.mapBtn;
      document.getElementById("rules-link").textContent = t.rulesBtn;
      document.getElementById("arrival-link").textContent = t.arrivalBtn;

      document.getElementById("label-address").textContent = t.labelAddress;
      document.getElementById("label-checkin").textContent = t.labelCheckin;
      document.getElementById("label-checkout").textContent = t.labelCheckout;
      document.getElementById("label-parking").textContent = t.labelParking;
      document.getElementById("parking-short").textContent = t.parkingShort;
      document.getElementById("label-password").textContent = t.labelPassword;

      document.getElementById("access-title").textContent = t.accessTitle;
      document.getElementById("access-text").textContent = t.accessText;
      document.getElementById("access-note").textContent = t.accessNote;

      document.getElementById("rules-title").textContent = t.rulesTitle;
      renderList("rules-list", t.rulesList);

      document.getElementById("waste-title").textContent = t.wasteTitle;
      document.getElementById("waste-text").textContent = t.wasteText;
      document.getElementById("waste-note").textContent = t.wasteNote;

      document.getElementById("checkout-title").textContent = t.checkoutTitle;
      renderList("checkout-list", t.checkoutList);

      document.getElementById("docs-title").textContent = t.docsTitle;
      document.getElementById("docs-it-title").textContent = t.docsItTitle;
      document.getElementById("docs-it-arrival").textContent = t.docsItArrival;
      document.getElementById("docs-it-rules").textContent = t.docsItRules;

      document.getElementById("docs-en-title").textContent = t.docsEnTitle;
      document.getElementById("docs-en-arrival").textContent = t.docsEnArrival;
      document.getElementById("docs-en-rules").textContent = t.docsEnRules;

      document.getElementById("docs-de-title").textContent = t.docsDeTitle;
      document.getElementById("docs-de-arrival").textContent = t.docsDeArrival;
      document.getElementById("docs-de-rules").textContent = t.docsDeRules;

      document.getElementById("docs-fr-title").textContent = t.docsFrTitle;
      document.getElementById("docs-fr-text").innerHTML = t.docsFrText;

      document.getElementById("docs-es-title").textContent = t.docsEsTitle;
      document.getElementById("docs-es-text").innerHTML = t.docsEsText;

      document.getElementById("docs-extra-title").textContent = t.docsExtraTitle;
      document.getElementById("docs-extra-pet").textContent = t.docsExtraPet;
      document.getElementById("docs-extra-umbrella").textContent = t.docsExtraUmbrella;

      document.getElementById("parking-title").textContent = t.parkingTitle;
      document.getElementById("parking-text").textContent = t.parkingText;

      document.getElementById("suggestions-title").textContent = t.suggestionsTitle;
      document.getElementById("restaurants-title").textContent = t.restaurantsTitle;
      renderList("restaurants-list", t.restaurantsList);

      document.getElementById("attractions-title").textContent = t.attractionsTitle;
      renderList("attractions-list", t.attractionsList);

      document.getElementById("map-title").textContent = t.mapTitle;
      document.getElementById("map-text").textContent = t.mapText;
      document.getElementById("coords-label").textContent = t.coordsLabel;

      document.getElementById("footer-text").textContent = t.footerText;

      document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });

      localStorage.setItem("guestGuideLang", lang);
    }

    document.querySelectorAll(".lang-btn").forEach(btn => {
      btn.addEventListener("click", () => setLanguage(btn.dataset.lang));
    });

    const savedLang = localStorage.getItem("guestGuideLang") || "it";
    setLanguage(savedLang);
  </script>
